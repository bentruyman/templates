name: Template Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: bun/cli
            runtime: bun
            install: bun install
            verify: bun run verify
          - template: bun/lib
            runtime: bun
            install: bun install
            verify: bun run verify
          - template: node/cli
            runtime: node
            install: npm ci
            verify: npm run verify
          - template: node/lib
            runtime: node
            install: npm ci
            verify: npm run verify

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.template }}/package-lock.json

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.template }}
        run: ${{ matrix.install }}

      - name: Verify template
        working-directory: ${{ matrix.template }}
        run: ${{ matrix.verify }}
